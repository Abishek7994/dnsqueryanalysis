services:
  - type: web
    name: dnsqueryanalysis-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/stats
    envVars:
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: dnsqueryanalysis
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        sync: false
